<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarLand — Onboarding</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
          },
          colors: {
            violet: {
              50:  '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    h1, h2 { font-family: 'Syne', sans-serif; }

    .bg-page {
      background: #f0eef9;
      min-height: 100vh;
    }

    /* Decorative blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    /* Step connector line */
    .step-line {
      width: 2px;
      background: linear-gradient(to bottom, #7c3aed, #c4b5fd);
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* Progress bar animation */
    .progress-fill {
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }

    /* Input focus ring */
    input:focus {
      outline: none;
      border-color: #7c3aed !important;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    /* Step pulse ring for active */
    .step-active-icon {
      box-shadow: 0 0 0 4px rgba(124,58,237,0.18);
    }

    /* Slide transition */
    .form-slide {
      animation: slideIn 0.35s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
      .sidebar { display: none !important; }
      .main-card { padding: 1.5rem !important; }
    }
    @media (max-width: 480px) {
      .phone-email-row { flex-direction: column !important; }
    }
  </style>
</head>
<body class="bg-page relative overflow-x-hidden">

  <!-- Decorative blobs -->
  <div class="blob w-96 h-96 bg-violet-400 top-[-80px] left-[-80px]"></div>
  <div class="blob w-80 h-80 bg-violet-600 bottom-[-60px] right-[-60px]"></div>

  <!-- NAVBAR -->
  <header class="relative z-10 bg-white/80 backdrop-blur border-b border-violet-100 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <!-- Star logo SVG -->
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <polygon points="14,2 17.5,10.5 26.5,10.5 19.5,16.5 22,25 14,20 6,25 8.5,16.5 1.5,10.5 10.5,10.5" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="font-display text-xl font-bold text-gray-800 tracking-tight">StarLand</span>
    </div>
    <div class="flex items-center gap-2 text-sm text-gray-500">
      <span class="hidden sm:inline">Hi, Kavita Khati</span>
      <div class="w-8 h-8 rounded-full bg-violet-100 flex items-center justify-center text-violet-600 font-semibold text-xs">KK</div>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="relative z-10 max-w-5xl mx-auto px-4 py-10">

    <!-- Hero heading -->
    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-display font-bold text-gray-800 mb-1">Welcome to StarLand</h1>
      <p class="text-gray-400 text-sm">Complete the 7 steps to get started</p>
    </div>

    <!-- Two-column layout -->
    <div class="flex gap-6 items-start">

      <!-- SIDEBAR -->
      <aside class="sidebar w-64 shrink-0 bg-white rounded-2xl shadow-sm border border-violet-100 p-5">
        <div id="steps-nav" class="flex flex-col gap-0">
          <!-- Steps injected by JS -->
        </div>
      </aside>

      <!-- MAIN FORM CARD -->
      <div class="flex-1 bg-white rounded-2xl shadow-sm border border-violet-100 p-8 main-card">

        <!-- Progress bar -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-2">
            <span id="progress-label" class="text-xs text-gray-400 font-medium">Step 1 of 7</span>
            <span id="progress-pct" class="text-xs text-violet-600 font-semibold">14%</span>
          </div>
          <div class="h-1.5 bg-violet-100 rounded-full overflow-hidden">
            <div id="progress-bar" class="progress-fill h-full bg-gradient-to-r from-violet-500 to-violet-400 rounded-full" style="width:14%"></div>
          </div>
        </div>

        <!-- Form area -->
        <div id="form-area"></div>

        <!-- Navigation buttons -->
        <div class="flex items-center justify-center gap-4 mt-8">
          <button onclick="prevStep()" id="btn-prev"
            class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:border-violet-400 hover:text-violet-600 transition-all disabled:opacity-30"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button onclick="submitStep()" id="btn-submit"
            class="px-10 py-2.5 rounded-full bg-violet-600 hover:bg-violet-700 text-white text-sm font-semibold transition-all shadow-md shadow-violet-200 active:scale-95"
          >
            Submit
          </button>

          <button onclick="nextStep()" id="btn-next"
            class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:border-violet-400 hover:text-violet-600 transition-all"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- SUCCESS TOAST -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-violet-600 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg translate-y-16 opacity-0 transition-all duration-300 flex items-center gap-2">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="white" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="toast-msg">Step saved!</span>
  </div>

<script>
const STEPS = [
  {
    id: 'org-profile',
    title: 'Organization Profile',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Organization Profile</h2>
      <div class="flex flex-col gap-3">
        <input type="text" placeholder="Organization Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="Organization Type" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <input type="tel" placeholder="Phone No" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
          <input type="email" placeholder="Email Id" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        </div>
        <input type="text" placeholder="Location" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
      </div>
    `
  },
  {
    id: 'territories',
    title: 'Territories and Sites',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 0 1 5 5c0 3.5-5 9-5 9S4 10.5 4 7a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="7" r="1.5" stroke="currentColor" stroke-width="1.4"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Territories and Sites</h2>
      <div class="flex flex-col gap-3">
        <input type="text" placeholder="Territory Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="Region / Area" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="Site Address" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <input type="text" placeholder="City" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
          <input type="text" placeholder="Country" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        </div>
      </div>
    `
  },
  {
    id: 'roles',
    title: 'Roles and Employees',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="6.5" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M1 15c0-3.038 2.462-5.5 5.5-5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="13" cy="6" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M17 15c0-3.038-2.462-5.5-5.5-5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Roles and Employees</h2>
      <div class="flex flex-col gap-3">
        <input type="text" placeholder="Employee Full Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="Job Title / Role" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <input type="email" placeholder="Work Email" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
          <input type="text" placeholder="Department" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        </div>
        <select class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 transition-all bg-white">
          <option value="" disabled selected>Permission Level</option>
          <option>Admin</option>
          <option>Manager</option>
          <option>Viewer</option>
        </select>
      </div>
    `
  },
  {
    id: 'products',
    title: 'Products and Services',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Products and Services</h2>
      <div class="flex flex-col gap-3">
        <input type="text" placeholder="Product / Service Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="SKU / Code" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <input type="number" placeholder="Unit Price ($)" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
          <input type="text" placeholder="Category" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        </div>
        <textarea placeholder="Description (optional)" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all resize-none"></textarea>
      </div>
    `
  },
  {
    id: 'scheduler',
    title: 'Scheduler Settings',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 2v2M12 2v2M2 7h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Scheduler Settings</h2>
      <div class="flex flex-col gap-3">
        <select class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 bg-white transition-all">
          <option value="" disabled selected>Timezone</option>
          <option>UTC+0 (London)</option>
          <option>UTC+1 (Paris)</option>
          <option>UTC+3 (Nairobi)</option>
          <option>UTC+5:30 (Mumbai)</option>
          <option>UTC-5 (New York)</option>
          <option>UTC-8 (Los Angeles)</option>
        </select>
        <div class="flex gap-3 phone-email-row">
          <input type="time" placeholder="Working Hours Start" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-all" value="08:00" />
          <input type="time" placeholder="Working Hours End" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-all" value="17:00" />
        </div>
        <select class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 bg-white transition-all">
          <option value="" disabled selected>Default Appointment Duration</option>
          <option>30 minutes</option>
          <option>1 hour</option>
          <option>2 hours</option>
        </select>
        <label class="flex items-center gap-3 cursor-pointer mt-1">
          <input type="checkbox" class="w-4 h-4 accent-violet-600" />
          <span class="text-sm text-gray-600">Enable automated reminders</span>
        </label>
      </div>
    `
  },
  {
    id: 'payment',
    title: 'Payment Settings',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v8M6.5 7.5C6.5 6.5 7.5 6 9 6s2.5.7 2.5 1.5-1 1.5-2.5 1.5-2.5.7-2.5 1.5S7.5 12 9 12s2.5-.5 2.5-1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Payment Settings</h2>
      <div class="flex flex-col gap-3">
        <select class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 bg-white transition-all">
          <option value="" disabled selected>Payment Method</option>
          <option>Bank Transfer</option>
          <option>Credit / Debit Card</option>
          <option>Mobile Money</option>
          <option>PayPal</option>
        </select>
        <input type="text" placeholder="Account Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <input type="text" placeholder="Account Number / IBAN" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <select class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 bg-white transition-all">
            <option value="" disabled selected>Currency</option>
            <option>USD</option><option>EUR</option><option>GBP</option><option>RWF</option><option>KES</option>
          </select>
          <input type="text" placeholder="Tax / VAT ID" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        </div>
      </div>
    `
  },
  {
    id: 'work-order',
    title: 'Create Work Order',
    icon: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h6M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    fields: () => `
      <h2 class="text-xl font-display font-bold text-gray-800 mb-5">Create Work Order</h2>
      <div class="flex flex-col gap-3">
        <input type="text" placeholder="Work Order Title" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <div class="flex gap-3 phone-email-row">
          <input type="date" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 transition-all" />
          <select class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-500 bg-white transition-all">
            <option value="" disabled selected>Priority</option>
            <option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
        <input type="text" placeholder="Assigned Employee" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all" />
        <textarea placeholder="Work Order Description" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 transition-all resize-none"></textarea>
      </div>
    `
  }
];

let currentStep = 0;
const completed = new Set();

function pct(step) {
  return Math.round(((step + 1) / STEPS.length) * 100);
}

function renderSidebar() {
  const nav = document.getElementById('steps-nav');
  nav.innerHTML = STEPS.map((s, i) => {
    const isDone = completed.has(i);
    const isActive = i === currentStep;
    const isFuture = !isDone && !isActive;

    const iconBg = isDone
      ? 'bg-violet-600 text-white'
      : isActive
        ? 'bg-violet-600 text-white step-active-icon'
        : 'bg-violet-50 text-violet-300 border border-violet-200';

    const textColor = isDone || isActive ? 'text-gray-800 font-medium' : 'text-gray-400';

    const checkOrIcon = isDone
      ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : s.icon;

    return `
      <div class="step-item flex items-start gap-3 cursor-pointer" onclick="jumpToStep(${i})">
        <div class="flex flex-col items-center">
          <div class="w-9 h-9 rounded-full flex items-center justify-center ${iconBg} shrink-0 transition-all duration-300">
            ${checkOrIcon}
          </div>
          ${i < STEPS.length - 1 ? `<div class="step-line h-8 mt-1"></div>` : ''}
        </div>
        <div class="pt-1.5">
          <p class="text-sm ${textColor} transition-colors leading-tight">${s.title}</p>
        </div>
      </div>
    `;
  }).join('');
}

function renderForm() {
  const area = document.getElementById('form-area');
  area.innerHTML = `<div class="form-slide">${STEPS[currentStep].fields()}</div>`;

  const p = pct(currentStep);
  document.getElementById('progress-bar').style.width = p + '%';
  document.getElementById('progress-pct').textContent = p + '%';
  document.getElementById('progress-label').textContent = `Step ${currentStep + 1} of ${STEPS.length}`;

  document.getElementById('btn-prev').disabled = currentStep === 0;
  renderSidebar();
}

function jumpToStep(i) {
  currentStep = i;
  renderForm();
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderForm();
  }
}

function nextStep() {
  completed.add(currentStep);
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    renderForm();
  }
}

function submitStep() {
  completed.add(currentStep);
  renderSidebar();
  showToast(currentStep === STEPS.length - 1 ? '🎉 All steps complete!' : `Step ${currentStep + 1} saved!`);
  if (currentStep < STEPS.length - 1) {
    setTimeout(() => { currentStep++; renderForm(); }, 600);
  } else {
    document.getElementById('btn-submit').textContent = '✓ Done!';
    document.getElementById('btn-submit').classList.add('bg-green-500', 'shadow-green-200');
    document.getElementById('btn-submit').classList.remove('bg-violet-600');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('translate-y-16', 'opacity-0');
  t.classList.add('translate-y-0', 'opacity-100');
  setTimeout(() => {
    t.classList.add('translate-y-16', 'opacity-0');
    t.classList.remove('translate-y-0', 'opacity-100');
  }, 2600);
}

// Init
renderForm();
</script>
</body>
</html>
